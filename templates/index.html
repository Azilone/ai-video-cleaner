<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nettoyer un fichier</title>
  <style>
    :root { font-family: system-ui, -apple-system, sans-serif; color: #17221b; background: #f7f9f7; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; }
    main { width: min(100%, 560px); padding: 32px; background: white; border: 1px solid #e2e8e3; border-radius: 18px; box-shadow: 0 12px 36px #17221b0b; }
    h1 { font-size: 1.7rem; line-height: 1.1; margin: 0 0 24px; letter-spacing: -.035em; }
    .picker { display: block; padding: 28px 20px; text-align: center; border: 2px dashed #bdd0c2; border-radius: 12px; cursor: pointer; color: #315741; background: #f9fcf9; font-weight: 600; }
    .picker:hover, .picker:focus-within { border-color: #3b7852; }
    input[type=file] { position: absolute; width: 1px; height: 1px; opacity: 0; }
    #file-name { display: block; margin-top: 6px; color: #66756a; font-size: .88rem; font-weight: 400; overflow-wrap: anywhere; }
    .hidden { display: none !important; }
    #status { min-height: 1.4em; margin: 14px 0 0; color: #617067; font-size: .9rem; }
    #status.error { color: #ae3030; }
    .verdict { margin-top: 20px; padding: 14px 16px; border-radius: 10px; font-weight: 650; }
    .verdict.success { background: #eaf5ed; color: #225b36; }
    .verdict.warning { background: #fff4e0; color: #825506; }
    details { margin-top: 14px; border: 1px solid #e1e8e3; border-radius: 10px; overflow: hidden; }
    summary { padding: 14px 16px; cursor: pointer; font-weight: 600; }
    details[open] summary { border-bottom: 1px solid #e1e8e3; }
    .settings { padding: 14px 16px; }
    .setting { display: flex; align-items: center; gap: 10px; padding: 7px 0; font-size: .94rem; }
    .setting input[type=checkbox] { width: 17px; height: 17px; accent-color: #246b42; }
    .setting input[type=number] { width: 72px; padding: 7px; border: 1px solid #c9d5cd; border-radius: 6px; font: inherit; }
    button, a.download { display: block; width: 100%; margin-top: 18px; padding: 14px 18px; border: 0; border-radius: 10px; background: #246b42; color: white; text-align: center; font: inherit; font-weight: 650; text-decoration: none; cursor: pointer; }
    button:disabled { opacity: .55; cursor: wait; }
    #result { margin-top: 28px; padding-top: 24px; border-top: 1px solid #e1e8e3; }
    #result h2 { font-size: 1.1rem; margin: 0; }
    #result .verdict { margin-top: 14px; }
    #preview { margin-top: 16px; }
    #preview img, #preview video { display: block; width: 100%; max-height: 340px; object-fit: contain; border-radius: 10px; background: #f2f4f2; }
    table { width: 100%; border-collapse: collapse; font-size: .9rem; }
    th, td { padding: 10px 14px; text-align: left; vertical-align: top; border-bottom: 1px solid #edf1ed; }
    tr:last-child th, tr:last-child td { border-bottom: 0; }
    th { font-weight: 500; width: 58%; }
    td { font-weight: 600; }
    .detail { display: block; margin-top: 3px; color: #7b877e; font-size: .8rem; font-weight: 400; overflow-wrap: anywhere; }
    .note { margin: 8px 14px 14px; color: #6c786f; font-size: .82rem; line-height: 1.4; }
  </style>
</head>
<body>
  <main>
    <h1>Nettoyer un fichier</h1>
    <label class="picker" for="file">Choisir une image ou une vidéo<span id="file-name">Jusqu’à {{ max_mb }} Mo</span></label>
    <input id="file" type="file" accept="image/*,video/mp4,video/quicktime,.m4v">
    <div id="status" role="status" aria-live="polite"></div>

    <section id="analysis" class="hidden" aria-label="Analyse du fichier">
      <div id="before-verdict" class="verdict"></div>
      <details>
        <summary>Voir l’analyse</summary>
        <table aria-label="Analyse avant nettoyage"><tbody id="before-rows"></tbody></table>
        <div id="before-note" class="note"></div>
      </details>
      <details>
        <summary>Paramètres</summary>
        <div class="settings">
          <label class="setting"><input type="checkbox" checked disabled> Supprimer les métadonnées intégrées</label>
        </div>
        <div class="settings" id="video-settings">
          <label class="setting"><input id="reencode" type="checkbox" checked> Réencoder la vidéo</label>
          <label class="setting"><input id="drop-audio" type="checkbox"> Retirer l’audio</label>
        </div>
        <div class="settings hidden" id="image-settings">
          <label class="setting">Qualité WebP <input id="quality" type="number" min="0" max="100" value="95"></label>
          <label class="setting"><input id="lossless" type="checkbox"> Sans perte</label>
        </div>
      </details>
      <button id="clean" type="button">Nettoyer</button>
    </section>

    <section id="result" class="hidden" aria-label="Résultat">
      <h2>Résultat</h2>
      <div id="after-verdict" class="verdict"></div>
      <div id="preview"></div>
      <a id="download" class="download">Télécharger le fichier</a>
      <details>
        <summary>Voir la vérification</summary>
        <table aria-label="Vérification après nettoyage"><tbody id="after-rows"></tbody></table>
        <div id="after-note" class="note"></div>
      </details>
    </section>
  </main>
  <script>
    const input = document.querySelector('#file');
    const cleanButton = document.querySelector('#clean');
    const status = document.querySelector('#status');
    let jobId = null;
    let kind = null;
    let selection = 0;

    function setStatus(message, error = false) {
      status.textContent = message;
      status.classList.toggle('error', error);
    }

    function showSummary(prefix, data) {
      const verdict = document.querySelector('#' + prefix + '-verdict');
      verdict.textContent = data.headline;
      verdict.className = 'verdict ' + data.tone;
      const body = document.querySelector('#' + prefix + '-rows');
      body.replaceChildren();
      for (const row of data.rows) {
        const tr = document.createElement('tr');
        const label = document.createElement('th');
        label.scope = 'row';
        label.textContent = row.label;
        const value = document.createElement('td');
        value.textContent = row.status;
        if (row.detail) {
          const detail = document.createElement('span');
          detail.className = 'detail';
          detail.textContent = row.detail;
          value.append(detail);
        }
        tr.append(label, value);
        body.append(tr);
      }
      document.querySelector('#' + prefix + '-note').textContent = data.note || '';
    }

    async function jsonResponse(response) {
      const data = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(data.error || 'Une erreur est survenue.');
      return data;
    }

    input.addEventListener('change', async () => {
      const current = ++selection;
      const file = input.files[0];
      jobId = null;
      document.querySelector('#analysis').classList.add('hidden');
      document.querySelector('#result').classList.add('hidden');
      document.querySelector('#file-name').textContent = file?.name || 'Jusqu’à {{ max_mb }} Mo';
      if (!file) { setStatus(''); return; }
      if (file.size > {{ max_mb }} * 1024 * 1024) {
        setStatus('Ce fichier dépasse la limite de {{ max_mb }} Mo.', true);
        return;
      }
      setStatus('Analyse en cours…');
      try {
        const form = new FormData();
        form.append('file', file);
        const data = await jsonResponse(await fetch('/inspect', { method: 'POST', body: form }));
        if (current !== selection) return;
        jobId = data.job_id;
        kind = data.kind;
        showSummary('before', data.inspection);
        document.querySelector('#video-settings').classList.toggle('hidden', kind !== 'video');
        document.querySelector('#image-settings').classList.toggle('hidden', kind !== 'image');
        document.querySelector('#analysis').classList.remove('hidden');
        setStatus('');
      } catch (error) {
        if (current === selection) setStatus(error.message, true);
      }
    });

    cleanButton.addEventListener('click', async () => {
      if (!jobId) return;
      const current = selection;
      cleanButton.disabled = true;
      cleanButton.textContent = 'Nettoyage en cours…';
      setStatus('Nettoyage et vérification en cours…');
      document.querySelector('#result').classList.add('hidden');
      const options = kind === 'video' ? {
        reencode: document.querySelector('#reencode').checked,
        drop_audio: document.querySelector('#drop-audio').checked
      } : {
        quality: Number(document.querySelector('#quality').value),
        lossless: document.querySelector('#lossless').checked
      };
      try {
        const data = await jsonResponse(await fetch('/clean/' + jobId, {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(options)
        }));
        if (current !== selection) return;
        showSummary('after', data.result);
        const media = document.createElement(kind === 'image' ? 'img' : 'video');
        media.src = data.file_url;
        if (kind === 'video') media.controls = true;
        else media.alt = 'Image nettoyée';
        document.querySelector('#preview').replaceChildren(media);
        const download = document.querySelector('#download');
        download.href = data.download_url;
        download.download = data.download_name;
        document.querySelector('#result').classList.remove('hidden');
        setStatus('');
      } catch (error) {
        if (current === selection) setStatus(error.message, true);
      } finally {
        cleanButton.disabled = false;
        cleanButton.textContent = 'Nettoyer';
      }
    });
  </script>
</body>
</html>
